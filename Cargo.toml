[package]
name = "legendary-tui"
version = "1.0.1"
edition = "2021"
description = "Fast, keyboard-driven Ratatui TUI frontend for Legendary Epic Games Store CLI"
repository = "https://github.com/kmanisk/legendary-tui"
readme = "README.md"
keywords = ["epic-games", "legendary", "tui", "ratatui", "gaming"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "legendary-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
