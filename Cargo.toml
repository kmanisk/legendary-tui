[package]
name = "legendary-tui"
version = "1.0.2"
edition = "2021"
authors = ["Kumar Manisk <mathewmanisk699@gmail.com>"]
description = "Fast, keyboard-driven Ratatui TUI frontend for Legendary Epic Games Store CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kmanisk/legendary-tui"
homepage = "https://github.com/kmanisk/legendary-tui"
documentation = "https://docs.rs/legendary-tui"
readme = "README.md"
keywords = ["epic-games", "legendary", "tui", "ratatui", "gaming"]
categories = ["command-line-utilities", "games"]
exclude = [
    "assets/*",
    "aur/*",
]

[[bin]]
name = "legendary-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ureq = { version = "2.10", default-features = false, features = ["tls"] }
unicode-width = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
